[project]
name = "gim"
version = "0.1.0"
description = "GIM: Evaluating models via tasks that integrate multiple cognitive domains"
license = "cc-by-4.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.83.0",
    "datasets>=4.7.0",
    "google-genai>=1.65.0",
    "inspect-ai>=0.3.186",
    "numpy>=2.0",
    "openai>=2.31.0",
    "pydantic>=2.0",
    "stamina>=25.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gim"]

[project.entry-points.inspect_ai]
gim = "gim.task"
gim_systems = "gim.system_registry"

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.5",
    "kaleido>=1.2.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
    "rich>=14.3.3",
    "seaborn>=0.13.2",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["gim"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]
